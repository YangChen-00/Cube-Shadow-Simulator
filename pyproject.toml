[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cube-shadow-simulator"
version = "0.2.0"
description = "cuRoboV2 and Viser assembly simulator for Cube Shadow Studio"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Cube Shadow team"}]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "viser>=1.1",
]

[project.scripts]
cube-shadow-sim = "cube_shadow_simulator.cli:main"

[tool.setuptools.packages.find]
include = ["cube_shadow_simulator*"]


